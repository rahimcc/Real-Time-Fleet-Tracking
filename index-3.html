<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Tracker</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: white; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px;
    }
    .vehicle-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2563eb; border: 2px solid white;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div id="panel">
    <div>Speed: <span id="speed">-</span> km/h</div>
    <div>Last update: <span id="updated">-</span></div>
  </div>
  <div id="map"></div>

  <script>
    const map = new maplibregl.Map({
      style: 'https://tiles.openfreemap.org/styles/liberty',
      container: 'map',
      center: [49.8671, 40.4093],
      zoom: 13
    });

    const el = document.createElement('div');
    el.className = 'vehicle-dot';
    el.textContent = '🚌'
    
    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([49.8671, 40.4093])
      .addTo(map);

    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (event) => {
      const d = JSON.parse(event.data);
      marker.setLngLat([d.lon, d.lat]);
      map.easeTo({ center: [d.lon, d.lat], duration: 900 });
      document.getElementById('speed').textContent = d.speed_kmh;
      document.getElementById('updated').textContent = new Date(d.timestamp * 1000).toLocaleTimeString();
    };
  </script>
</body>
</html>
