<!DOCTYPE html>
<html>
<head>
  <title>Azerbaijan Map Dashboard</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: white; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px; max-width: 240px;
    }
    #panel h3 { margin: 0 0 6px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="panel">
    <h3>Azerbaijan</h3>
    <div>Click a city marker for details.</div>
  </div>
  <div id="map"></div>

  <script>
    // Free, no-API-key vector tile style (OpenFreeMap)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [47.5769, 40.1431], // Azerbaijan centroid
      zoom: 6.3
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // A few sample cities — swap in your own data / live feed later
    const cities = [
      { name: 'Baku', coords: [49.8671, 40.4093], note: 'Capital, ~2.3M pop.' },
      { name: 'Ganja', coords: [46.3606, 40.6828], note: 'Second-largest city' },
      { name: 'Sumqayit', coords: [49.6685, 40.5892], note: 'Industrial hub' },
      { name: 'Sheki', coords: [47.1706, 41.1919], note: 'Historic Silk Road town' },
      { name: 'Lankaran', coords: [48.8524, 38.7539], note: 'Southern coastal city' },
      { name: 'Nakhchivan', coords: [45.4126, 39.2089], note: 'Exclave capital' },
    ];

    cities.forEach(city => {
      const marker = new maplibregl.Marker({ color: '#2563eb' })
        .setLngLat(city.coords)
        .setPopup(new maplibregl.Popup().setHTML(`<strong>${city.name}</strong><br>${city.note}`))
        .addTo(map);
    });
  </script>
</body>
</html>
