services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        nslookup kafka
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic vehicle-locations --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic train-locations --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092
        echo "Topic create"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 30s


  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard

  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"   # no longer publicly mapped — only reachable by Caddy internally
    # remove any "ports: 8000:8000" line entirely
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  producer:
    build: .
    container_name: producer
    restart: unless-stopped
    command: ["python3", "-m", "backend.producers.producer_drivers"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  produce-fleet:
    build: .
    container_name: produce_fleet
    restart: unless-stopped
    command: ["python3", "-m", "backend.producers.produce_fleet"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  produce-train:
    build: .
    container_name: produce_train
    restart: unless-stopped
    command: ["python3", "-m", "backend.producers.producer_train"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  consumer:
    build: .
    container_name: consumer
    restart: unless-stopped
    command: ["python3", "-u", "-m","backend.consumers.consumer_to_redis"]
    depends_on:
       kafka-init:
        condition: service_completed_successfully
       kafka:
        condition: service_healthy
       redis:
        condition: service_healthy
    

volumes:
  caddy-data:
  caddy-config:
  kafka-data: